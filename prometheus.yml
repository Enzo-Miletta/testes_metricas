# Configuração do Prometheus
global:
  scrape_interval: 15s      # Intervalo padrão de coleta
  evaluation_interval: 15s  # Intervalo de avaliação de regras
  external_labels:
    monitor: 'infrastructure-monitor'

# Configuração de alertas (opcional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Configurações de scraping
scrape_configs:
  # Monitoramento do próprio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Métricas do sistema (CPU, Memória, Disco)
  - job_name: 'system-metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'system'
          environment: 'production'

  # Monitoramento de APIs
  - job_name: 'api-monitor'
    static_configs:
      - targets: ['host.docker.internal:8001']
        labels:
          service: 'api-health'
          environment: 'production'

  # Adicione mais jobs aqui conforme necessário
  # Exemplo: Node Exporter (se estiver usando)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['localhost:9100']
